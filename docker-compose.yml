services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reunion-table-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATA_DIR=/app/data
    volumes:
      - reunion-data:/app/data

volumes:
  reunion-data:
    driver: local
